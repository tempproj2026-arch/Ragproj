[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestion pipeline for RAG over Scanned Books"
requires-python = "==3.11.*"
dependencies = [
    "ragcore",
    "docling",
    "openai"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ingest = "ingestion.cli:main"

[tool.uv.sources]
ragcore = { workspace = true }
